[package]
name = "almena-app"
description = "Almena, the windowed application, on phones and on computers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Everything but the launch lives in the library, so that a test can link against it.
#
# All three crate types, unlike the desktop-only siblings: `staticlib` and `cdylib` are what
# iOS and Android link against, and this application ships on both. The `_lib` suffix is what
# keeps the library's artifact name from colliding with the binary's on Windows.
name = "almena_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The facade this program writes records through, and the format they take. The format is a
# crate of its own because it is a decision — the line shape, the rotation, the retention that
# `.agents/rules/logging.md` sets — and a decision is easier to hold to in one place than in a
# builder call halfway down a plugin registration.
almena-log = { workspace = true }
log = { workspace = true }
tauri-plugin-log = { workspace = true }
# On every platform, unlike the three below. A phone has no window to own and no command line,
# but it has a screen to put a notification on, so this one is not a desktop concern.
tauri-plugin-notification = { workspace = true }

# Desktop only, and compiled out of the mobile binary entirely. A phone's operating system
# owns the window's geometry, already guarantees one running instance of an application, and
# decides for itself when an application may run — so none of these has anything to do there. This is the shape
# `.agents/rules/supported-platforms.md` asks for: not a feature one platform lacks, but a
# platform that does not have the thing the feature is about.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# Two more that are here for what a computer is rather than for what it can do. An application
# on a computer is a file somebody downloaded, so it is the one that has to be able to replace
# itself; a phone's store does that and offers nothing to call. Dialogs are the other way
# round — the plugin serves all five platforms and this project registers it on three, because
# a decision a phone puts on a screen is not a decision a phone puts in a dialog.
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
# The Agent Protocol, and the encoding it is framed in. Desktop alone, because the agent is a
# second program this application runs as a child — which a phone's operating system offers no
# way to do. Neither reaches Tauri, and `task isolation` is what says so.
almena-agent-protocol = { workspace = true }
rmp-serde = { workspace = true }

# Windows and Linux, and deliberately not macOS. Each of these two keeps one register for
# "open this when somebody logs in" and this plugin writes to it.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = { workspace = true }

# macOS alone, because macOS keeps two registers and this is the one that reaches the right
# one. See `src/open_at_login.rs` for what the difference is and why it matters.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = { workspace = true }

# Not a dependency: nothing in this application links it. It is here so that a test can ask
# Tauri's path resolver and `almena-paths` the same question and fail if they disagree, which
# is what lets the CLI promise to put things where this application puts them.
[dev-dependencies]
almena-paths = { workspace = true }
# For the one test that drives the staged agent over real pipes. Already a dependency of this
# crate on a desktop target; named here so that the test compiles on any of them.
almena-agent-protocol = { workspace = true }
# `test` brings Tauri's own mock application, which is the only way to hold a real path
# resolver in a test. A feature of a dependency this crate already has, enabled for tests
# alone.
tauri = { workspace = true, features = ["test"] }
