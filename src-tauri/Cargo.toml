[package]
name = "almena-app"
description = "Almena, the windowed application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Everything but the launch lives in the library, so that a test can link against it.
#
# One crate type, like every other member of this workspace. There were three while this
# application was also built for phones — `staticlib` and `cdylib` are what iOS and Android
# link against — and neither is produced for anything this repository builds now. The `_lib`
# suffix is what keeps the library's artifact name from colliding with the binary's on Windows.
name = "almena_app_lib"
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The facade this program writes records through, and the format they take. The format is a
# crate of its own because it is a decision — one line shape for every program here, the size a
# file rotates at, how many are kept — and a decision is easier to hold to in one place than in
# a builder call halfway down a plugin registration.
# Everything a node does. This face draws it and holds no logic of its own.
almena-node = { workspace = true }
# What carries the interface, when this node is asked to serve it. The same one the terminal uses.
almena-lookup = { workspace = true }
almena-mesh = { workspace = true }
almena-serve = { workspace = true }
almena-tls = { workspace = true }
almena-api = { workspace = true }
tokio = { workspace = true }
almena-log = { workspace = true }
log = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-notification = { workspace = true }
# What the window remembers between runs, and what folds a second launch into the running
# application instead of starting another.
tauri-plugin-window-state = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# Two that nothing calls yet. An application here is a file somebody downloaded, so it is the
# one that has to be able to replace itself; dialogs are what a native question will come from
# the day a screen has one to ask.
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
# The Agent Protocol, and the encoding it is framed in. The agent is a second program this
# application runs as a child. Neither reaches Tauri, and `task isolation` is what says so.
almena-agent-protocol = { workspace = true }
rmp-serde = { workspace = true }

# Windows and Linux, and deliberately not macOS. Each of these two keeps one register for
# "open this when somebody logs in" and this plugin writes to it.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = { workspace = true }

# macOS alone, because macOS keeps two registers and this is the one that reaches the right
# one. See `src/open_at_login.rs` for what the difference is and why it matters.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = { workspace = true }

# Not a dependency: nothing in this application links it. It is here so that a test can ask
# Tauri's path resolver and `almena-paths` the same question and fail if they disagree, which
# is what lets the CLI promise to put things where this application puts them.
[dev-dependencies]
almena-paths = { workspace = true }
# For the one test that drives the staged agent over real pipes. Already a dependency of this
# crate on a desktop target; named here so that the test compiles on any of them.
almena-agent-protocol = { workspace = true }
# `test` brings Tauri's own mock application, which is the only way to hold a real path
# resolver in a test. A feature of a dependency this crate already has, enabled for tests
# alone.
tauri = { workspace = true, features = ["test"] }
