[package]
name = "almena-cli"
description = "Almena, the node for the computers that have no graphical system to run one from"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
# The binary a person types, which is not the package's name. `almena-app` is the windowed
# application's, set in `tauri.conf.json`, and the two must not collide.
name = "almena"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
# The record format, shared with the windowed application because it is one decision and not
# two. This crate reaching `tauri` is what `task isolation` refuses.
# Everything a node does. This face draws it and holds no logic of its own.
almena-frozen = { workspace = true }
almena-node = { workspace = true }
# What carries the interface, when this node is asked to serve it.
almena-lookup = { workspace = true }
almena-mesh = { workspace = true }
almena-serve = { workspace = true }
almena-tls = { workspace = true }
almena-api = { workspace = true }
tokio = { workspace = true }
almena-log = { workspace = true }
almena-paths = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
ctrlc = { workspace = true }
# Rotation names a file after the moment it happened, and that moment is UTC like every other
# one this project writes down.
time = { workspace = true }
tokio-native-tls = "0.3"
native-tls = "0.2"

