version: "3"

vars:
  # A command line for whichever program is being run, e.g. task dev ARGS="--hidden" or
  # task dev:cli ARGS="--quiet". The windowed application answers one flag and reads it in
  # src-tauri/src/launch.rs; the node's surface is in cli/src/arguments.rs.
  ARGS: ""
  # Where the agent's own repository is, for `task agent:build`. It is a repository of its own
  # — released on its own schedule, not a subdirectory of this one — so a checkout of this
  # repository alone will not have it, and that is an accepted state rather than a failure.
  AGENT_REPO: "../agent"
  # The built agent to bundle. What `task build` in that repository leaves behind.
  AGENT_DIST: "../agent/dist/almena-agent"

  # ----- What a node in development answers on ---------------------------------------------
  #
  # **The window and the terminal are two nodes**, not two views of one: they keep separate data
  # directories, so they hold separate keys, so they are two participants that happen to share a
  # computer. Two nodes cannot share a port, so each has its own here — and running both is a
  # normal thing to do while working, not a mistake to be caught later by a bind that fails.
  #
  # Override any of them for a run: task dev:cli API=127.0.0.1:9999 MESH=4009
  API: "127.0.0.1:8790"
  MESH: "4001"
  # The zone a node looks in for somebody to join. **It opens a network only when nobody is
  # there**, and it finds that out by asking — so pointing this somewhere else is answering that
  # question about a different network. Empty means the one the node already knows.
  ZONE: ""
  # Which network `task dev:cli` is about: `dev` or `pro`. Development is opened again as often
  # as it needs to be; production is opened once, ever, and is never the default of anything.
  NETWORK: "dev"
  # A resolver to ask instead of this machine's own, as `ip:port`. Empty means the machine's. The
  # zone emulated in the dns repository answers on 127.0.0.1:5300 (`task emulate:dev` there), and
  # this is how a development node is pointed at it.
  RESOLVER: ""
  # `true` to join the network the zone names instead of opening one — the second development
  # node on a machine, or a node joining a network somebody else opened. Anything else opens.
  JOIN: ""
  # `true` to hold post for other people, and say so in the record.
  MEDIATOR: ""

  # What the windowed node binds, which is not a flag on anything: it is compiled in, at
  # src-tauri/src/node.rs. Repeated here only so `task dev` can name whoever holds it.
  WINDOW_API: "127.0.0.1:8791"
  WINDOW_MESH: "4002"


tasks:
  # Announce the project and the operation about to run. Every task calls it as
  # its first command, passing OPERATION.
  banner:
    internal: true
    silent: true
    cmds:
      - |
        cat <<'ART'
            _     _      __  __  _____  _   _     _
           / \   | |    |  \/  || ____|| \ | |   / \
          / _ \  | |    | |\/| ||  _|  |  \| |  / _ \
         / ___ \ | |___ | |  | || |___ | |\  | / ___ \
        /_/   \_\|_____||_|  |_||_____||_| \_|/_/   \_\
        ART
      - |
        # The operation is drawn character by character, so a new task needs no
        # artwork of its own. Only shell builtins are used, so that the banner
        # also runs on Windows, where Task interprets these commands itself.
        draw() {
          rest="$1"; top=''; mid=''; bot=''
          while [ -n "$rest" ]; do
            c="${rest%"${rest#?}"}"; rest="${rest#?}"
            case "$c" in
              a|A) t='____'; m='|__|'; b='|  |' ;;
              b|B) t='___ '; m='|__]'; b='|__]' ;;
              c|C) t='____'; m='|   '; b='|___' ;;
              d|D) t='___ '; m='|  \'; b='|__/' ;;
              e|E) t='____'; m='|___'; b='|___' ;;
              f|F) t='____'; m='|___'; b='|   ' ;;
              g|G) t='____'; m='| __'; b='|__]' ;;
              h|H) t='_  _'; m='|__|'; b='|  |' ;;
              i|I) t='_'; m='|'; b='|' ;;
              j|J) t='   _'; m='   |'; b='|__|' ;;
              k|K) t='_  _'; m='|_/ '; b='| \_' ;;
              l|L) t='_   '; m='|   '; b='|___' ;;
              m|M) t='_  _'; m='|\/|'; b='|  |' ;;
              n|N) t='_  _'; m='|\ |'; b='| \|' ;;
              o|O) t='____'; m='|  |'; b='|__|' ;;
              p|P) t='___ '; m='|__]'; b='|   ' ;;
              q|Q) t='____'; m='|  |'; b='|_\|' ;;
              r|R) t='____'; m='|__/'; b='|  \' ;;
              s|S) t='____'; m='[__ '; b='___]' ;;
              t|T) t='___'; m=' | '; b=' | ' ;;
              u|U) t='_  _'; m='|  |'; b='|__|' ;;
              v|V) t='_  _'; m='|  |'; b=' \/ ' ;;
              w|W) t='_  _'; m='|  |'; b='|/\|' ;;
              x|X) t='_  _'; m=' \/ '; b='_/\_' ;;
              y|Y) t='_   _'; m=' \_/ '; b='  |  ' ;;
              z|Z) t='___'; m='  /'; b='/__' ;;
              :)   t='  '; m='. '; b='. ' ;;
              *)   t='  '; m='  '; b='  ' ;;
            esac
            top="$top$t "; mid="$mid$m "; bot="$bot$b "
          done
          printf '%s\n%s\n%s\n' "$top" "$mid" "$bot"
        }
        echo ""
        draw '{{.OPERATION}}'
        echo ""

  # Refuse to start where something is already answering, and say what holds it. Every port here
  # is written down — in a config, in the table of what answers where, in an instruction — so a
  # busy one is not a thing to work around: Astro quietly takes the next port up and leaves every
  # instruction naming this one wrong, Vite refuses with a message that names no process, and a
  # second node fails to bind at all. Each of those is the same fact said badly, and the fact is
  # that the last run never stopped.
  #
  # PORTS is a list, each entry a port or a `host:port`. Where there is no `lsof` — Windows, where
  # Task runs these commands itself — nothing is asked and nothing is said, because a check that
  # cannot run is not a reason to refuse.
  ports:
    internal: true
    silent: true
    cmds:
      - |
        command -v lsof >/dev/null 2>&1 || exit 0
        held=""
        for entry in {{.PORTS}}; do
          port="${entry##*:}"
          # `|| true` twice: lsof exits 1 where it matches nothing, and a free port is the
          # ordinary case rather than a failure.
          pids="$({ lsof -nP -iTCP:"$port" -sTCP:LISTEN -t 2>/dev/null || true; lsof -nP -iUDP:"$port" -t 2>/dev/null || true; } | sort -u)"
          [ -n "$pids" ] || continue
          [ -n "$held" ] || printf '\nSomething is already answering:\n\n'
          for pid in $pids; do
            printf '  %-5s  pid %-7s %s\n' "$port" "$pid" "$(ps -p "$pid" -o user=,etime=,command= 2>/dev/null | cut -c1-86)"
            case " $held " in *" $pid "*) ;; *) held="$held $pid" ;; esac
          done
        done
        [ -n "$held" ] || exit 0
        printf '\nThe ports are fixed, so nothing here moves to the next one up. Stop that and run\nthis again:\n\n  kill%s\n\nStill there a moment later:\n\n  kill -9%s\n\n' "$held" "$held"
        exit 1

  default:
    desc: List available tasks
    cmds:
      - task: banner
        vars: { OPERATION: list }
      - task --list
    silent: true

  install:
    desc: Install frontend dependencies
    cmds:
      - task: banner
        vars: { OPERATION: install }
      - pnpm install
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml

  # ----- Checks --------------------------------------------------------------

  # `check`, `format` and `test` are narrower than they will end up, and deliberately so.
  # ESLint, Prettier and Vitest are not installed in this repository yet, so the frontend
  # halves of these three — `pnpm lint`, `pnpm format:check`, `pnpm test` — are absent rather
  # than present and passing vacuously. Each joins the task below it in the step that brings
  # its tool.

  catalogs:
    desc: Check that every translation catalog holds the same keys
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: catalogs }
      - node scripts/check-catalogs.mjs

  parity:
    desc: Check that neither face of the node can do something the other cannot
    cmds:
      - task: banner
        vars: { OPERATION: parity }
      # It runs here as well as in `task test` because it is not a test of behaviour: it is the
      # rule that the two ways of running a node stay the same node. A change that breaks it has
      # to fail before it is pushed, not when somebody next runs the suite.
      #
      # Three halves: the table itself, and each face holding its real surface to its column —
      # the flags the terminal parses, the commands the window registers. A flag or a command
      # added without a row fails in its own face's test, which is where whoever added it is.
      - 'cargo test -q -p almena-node facade::'
      - 'cargo test -q -p almena-cli what_this_face_parses_is_what_the_table_says_it_offers'
      - 'cargo test -q -p almena-app what_this_face_registers_is_what_the_table_says_it_offers'
      - 'cargo test -q -p almena-app every_command_named_here_is_registered'

  check:
    desc: Run every check a change has to pass before it is pushed
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: check }
      # Formatting first: it is the cheapest failure and the least interesting to argue
      # about. A warning is a failure, so that the count never grows past reading.
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - pnpm exec tsc --noEmit
      - task: catalogs
      - task: isolation
      - task: parity
      # **Last, because it is the most expensive, and inside because the description says so.**
      # A task called *every check a change has to pass* that left the suites out would be one
      # a change could run in full and still be half done — and `client` and `web` both run
      # theirs here. Running it twice, from here and from `task test`, costs a warm rebuild.
      - task: test

  agent:build:
    desc: Build the agent from its own repository, so that there is something to stage
    preconditions:
      - sh: test -d {{.AGENT_REPO}}
        msg: |
          No agent at {{.AGENT_REPO}}. It is a repository of its own:
          git clone https://github.com/almena-network/agent
          Or point this at one: task agent:build AGENT_REPO=/path/to/agent
    cmds:
      - task: banner
        vars: { OPERATION: agent }
      - task -d {{.AGENT_REPO}} build

  agent:stage:
    desc: Put the built agent where the bundle will pick it up, if there is one to put
    cmds:
      # The directory always exists, with or without an agent in it. A contributor who cloned
      # this repository alone still gets a bundle that builds, and its AI screen reports
      # honestly that this build carries no agent — a state that has to exist and be drawn
      # whatever happens, so nothing is being worked around here.
      - task: agent:clean
      - |
        if [ -d "{{.AGENT_DIST}}" ]; then
          cp -R "{{.AGENT_DIST}}/." src-tauri/resources/almena-agent/
          echo "staged the agent from {{.AGENT_DIST}}"
        else
          echo "no agent at {{.AGENT_DIST}} — this build will carry none, and will say so"
        fi

  agent:clean:
    desc: Take the staged agent back out, keeping the directory the bundle expects
    cmds:
      # Everything but the note, which is committed: the bundle names this directory, so it
      # has to exist in a fresh checkout with no agent built anywhere.
      - |
        mkdir -p src-tauri/resources/almena-agent
        find src-tauri/resources/almena-agent -mindepth 1 ! -name .keep -maxdepth 1 \
          -exec rm -rf {} +

  isolation:
    desc: Check that the two programs stay out of each other's dependency graph
    cmds:
      - task: banner
        vars: { OPERATION: isolation }
      # `cargo tree -i` asks which crates depend on a package *within this crate's graph*, and
      # fails when the package is not in that graph at all — so here success is the failure,
      # and silence is the pass.
      #
      # Each binary links what its own graph holds and nothing else, which is only true while
      # the graphs are kept apart. A windowed application that linked `ratatui`, or a node that
      # linked `tauri`, would carry a renderer it never calls: minutes of build time and tens of
      # megabytes, for nothing. The two crates that are neither program must reach neither
      # framework, which is what makes them decisions rather than parts of one of them.
      - |
        failed=0
        assert_cannot_reach() {
          if cargo tree -q -p "$1" -i "$2" >/dev/null 2>&1; then
            echo "$1 can reach $2: $3" >&2
            failed=1
          fi
        }

        assert_cannot_reach almena-log tauri \
          "the log format must know about no framework"
        assert_cannot_reach almena-paths tauri \
          "the resolver exists for the programs Tauri does not serve"
        assert_cannot_reach almena-cli tauri \
          "the node must not link a webview it never draws in"
        assert_cannot_reach almena-app ratatui \
          "the windowed application must not link a terminal renderer"
        assert_cannot_reach almena-agent-protocol tauri \
          "a wire contract must reach no framework, or no other runtime could speak it"
        assert_cannot_reach almena-cli almena-agent-protocol \
          "a node in a rack has no agent beside it to speak to"

        # The protocol crates are replicated in `client` rather than shared, so that no
        # repository ends up owning the format the others depend on and moving the ground under
        # them with its versions. A dependency any of them picks up here is one that repository
        # has to pick up too, or the copy stops being a copy — which is why they must reach
        # nothing that is an application.
        assert_cannot_reach almena-cbor tauri \
          "the bytes an identifier hangs from must not know what draws them"
        assert_cannot_reach almena-suite tauri \
          "the suite is replicated in the holder's app, which draws with something else"
        assert_cannot_reach almena-time tauri \
          "an epoch is arithmetic, and arithmetic links no framework"
        assert_cannot_reach almena-format tauri \
          "the shapes both repositories have to agree on must not know what draws them"
        assert_cannot_reach almena-store tauri \
          "what a node keeps is decided by the protocol, not by whether there is a window"
        # The core the two faces sit on. If it could reach either framework, the face would have
        # somewhere to put logic of its own — which is the failure the two-face rule exists to
        # prevent, arriving as a dependency rather than as a decision.
        assert_cannot_reach almena-node tauri \
          "the core must not know which face is drawing it"
        assert_cannot_reach almena-node ratatui \
          "nor the other one"
        # The shape of an answer must not be able to learn what a status code, a header or a
        # stream is. If it could, the transport would have somewhere to decide something, and a
        # transport that decides is a second place the node's behaviour lives.
        assert_cannot_reach almena-api tauri \
          "an answer is not drawn"
        assert_cannot_reach almena-api ratatui \
          "nor is it drawn the other way"
        assert_cannot_reach almena-api hyper \
          "and it must not learn what a status code is, or the transport would have somewhere to decide"
        # The transport carries; it does not draw. It has to work under both faces, so it may know
        # neither.
        assert_cannot_reach almena-serve tauri \
          "the transport serves the same node whichever face is running"
        assert_cannot_reach almena-serve ratatui \
          "and the same the other way"
        # The reference issuer and verifier is a third program, on the library and the node's own
        # crates, and it reaches neither framework for the same reason the node's core does not:
        # a partner is a program an organisation runs in a rack, and a renderer it never calls
        # would be minutes of build time and tens of megabytes for nothing.
        assert_cannot_reach almena-partner tauri \
          "the partner draws nothing in a webview"
        assert_cannot_reach almena-partner ratatui \
          "nor in a terminal"

        exit "$failed"

  test:agent:
    desc: Drive the staged agent over real pipes, to check the two halves of the contract meet
    cmds:
      - task: banner
        vars: { OPERATION: agent }
      # Ignored by `task test`, and run on purpose here: it needs an artifact from another
      # repository, and a test that passed quietly when it could not find one would be green
      # on every machine that had nothing to test with.
      - cargo test -p almena-app --test speaks_to_the_agent -- --ignored --test-threads=1

  test:
    desc: Run the test suites
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: test }
      - cargo test --workspace

  format:
    desc: Format the source
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: format }
      - cargo fmt --all

  # ----- Branding ------------------------------------------------------------

  icons:
    desc: Regenerate every icon from assets/branding
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: icons }
      # **One brand, one mark, and the client wears the same one.** There was a version of this
      # that reversed the node's mark inside a dark square so that a machine running both would
      # not put two identical tiles in the Dock. It is gone: the mark is the project's, neither
      # application owns a variation on it, and on the bar the reversed one could not be a
      # template image — which on macOS means a tile that ignores the bar it sits in.
      #
      # The manifest drives the whole set: the desktop sizes and the Windows Store logos. It
      # also carried the Android adaptive layers — background, foreground and monochrome, which
      # cannot be derived from a single square — and nothing built here runs on a phone now.
      - pnpm tauri icon assets/branding/icon-manifest.json
      # macOS wants its own padding inside the rounded square, which the manifest has no way
      # to express, so the `.icns` is generated a second time from the artwork that has it.
      # Without this the icon in the Dock is visibly larger than every other one there.
      - cmd: pnpm tauri icon assets/branding/app-icon-macos.png -o /tmp/almena-icons
        platforms: [darwin]
      - cmd: cp /tmp/almena-icons/icon.icns src-tauri/icons/icon.icns
        platforms: [darwin]
      - cmd: rm -rf /tmp/almena-icons
        platforms: [darwin]
      # The tray glyphs, at the size a menu bar draws them, and two files because two platforms
      # need different ones: macOS is handed the black mark as a template image and fills the mask
      # itself, and everywhere else gets the same shape painted in the identity colour, because a
      # black mark on a dark bar is a mark nobody can see. **The same two the client generates from
      # the same artwork** — see `src-tauri/src/tray.rs`.
      - cmd: sips -z 32 32 assets/branding/tray/tray-icon.png --out src-tauri/icons/tray.png
        platforms: [darwin]
      - cmd: sips -z 32 32 assets/branding/tray/tray-icon-colour.png --out src-tauri/icons/trayColour.png
        platforms: [darwin]

  # ----- Development ---------------------------------------------------------

  dev:
    aliases: [dev:desktop]
    desc: 'Run the windowed node, with hot reload. ARGS="--hidden" gives it a command line'
    deps: [install, agent:stage]
    cmds:
      - task: banner
        vars: { OPERATION: dev }
      # 1420 is the frontend Vite serves and refuses to move off; the other two are the node
      # inside the window. A second window is a second node, and it cannot have either.
      - task: ports
        vars: { PORTS: "1420 {{.WINDOW_API}} {{.WINDOW_MESH}}" }
      # Two `--` and both are load-bearing: the first ends what is meant for the Tauri CLI, the
      # second ends what is meant for cargo, and what is left over is the application's own
      # command line. Without them `task dev ARGS="--hidden"` hands `--hidden` to cargo, which
      # does not know it. This is the only way to try `--hidden`, `--help` or `--version`
      # without building a binary first.
      - pnpm tauri dev {{if .ARGS}}-- -- {{.ARGS}}{{end}}

  dev:cli:
    desc: 'Run a whole development node in this terminal: its network, its interface and its place on the mesh (NETWORK=, RESOLVER=, JOIN=true, MEDIATOR=true)'
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: "dev:cli" }
      - task: ports
        vars: { PORTS: "{{.API}} {{.MESH}}" }
      # **Everything a node needs to be a node, because a node that does none of it is not one to
      # develop against.** Left to a bare `cargo run` this comes up holding no network, answering
      # nobody and reachable by nobody — which is a state worth being able to reach, and a poor
      # thing to have to type four flags to get out of every time.
      #
      # It opens the network unless `JOIN=true`, and opening refuses when the zone names somebody:
      # the first development node on a machine opens, the second joins. Against the emulated zone
      # — `task emulate:dev` in the dns repository — that is `task dev:cli RESOLVER=127.0.0.1:5300`
      # for the first and `task dev:cli RESOLVER=127.0.0.1:5300 JOIN=true MESH=4003 API=…` for the
      # second, once the first has been written into the emulation's file.
      #
      # No hot reload and nothing to serve: this program has no frontend. `ARGS` is added on the
      # end and wins, because a flag given twice is the last one that counts — so `task dev:cli
      # ARGS="--quiet"` shows the records, and ARGS can override anything below it.
      - >
        cargo run -q -p almena-cli --
        --network {{.NETWORK}}
        {{if eq .JOIN "true"}}--join{{else}}--open{{end}}
        --serve {{.API}}
        --mesh {{.MESH}}
        {{if .ZONE}}--zone {{.ZONE}}{{end}}
        {{if .RESOLVER}}--resolver {{.RESOLVER}}{{end}}
        {{if eq .MEDIATOR "true"}}--mediator{{end}}
        {{.ARGS}}

  dev:cli:mediator:
    desc: 'The same development node, holding post for other people (the mediator a client needs)'
    deps: [install]
    cmds:
      - task: dev:cli
        vars:
          MEDIATOR: "true"

  dev:bare:
    desc: Run the node in this terminal with nothing turned on, to see what it says about that
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: "dev:bare" }
      # A node holding no network reports having looked at nothing rather than reporting nothing,
      # and that is a state somebody has to be able to see on purpose.
      - cargo run -q -p almena-cli -- {{.ARGS}}

  # ----- Release builds ------------------------------------------------------

  build:
    aliases: [build:desktop]
    desc: Build the desktop installer for this host's operating system
    deps: [install, catalogs, agent:stage]
    cmds:
      - task: banner
        vars: { OPERATION: build }
      # Leaves the installers under target/release/bundle/ and the binary itself at
      # target/release/almena-app. Whatever `agent:stage` put in place is bundled with it;
      # where it put nothing, the application says so on its AI screen rather than pretending.
      - pnpm tauri build

  build:debug:
    desc: Build the desktop bundle unoptimized, so that it still says it is a development build
    deps: [install, catalogs, agent:stage]
    cmds:
      - task: banner
        vars: { OPERATION: "build:debug" }
      # `--debug` keeps `debug_assertions`, which is the one thing the status strip reads to
      # decide whether to say *Development* — so this is how a **bundle** that still admits what
      # it is gets made, and it takes a fraction of the time the release build does. Everything
      # lands under target/debug/ instead of target/release/.
      - pnpm tauri build --debug

  build:cli:
    desc: Build the node for this computer
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: "build:cli" }
      # One binary and no bundle. A node on a server is a file somebody copies there, and which
      # packages that becomes — the Debian and RPM families the desktop already builds for — is
      # not decided.
      - cargo build -q --release -p almena-cli
      - cmd: echo "Built target/release/almena"
        silent: true

  build:partner:
    desc: Build the reference issuer and verifier for this computer
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: "build:partner" }
      # One binary and no bundle, like the node's: a partner is a file an organisation copies to
      # the machine it issues and verifies from.
      - cargo build -q --release -p almena-partner
      - cmd: echo "Built target/release/almena-partner"
        silent: true

  build:all:
    desc: Build the agent, then both programs for this computer, with that agent inside the desktop
    cmds:
      - task: banner
        vars: { OPERATION: "build:all" }
      # Commands rather than `deps`, and that is the whole of this task: dependencies run at
      # the same time as each other, and `agent:stage` would then copy whatever
      # {{.AGENT_DIST}} happened to hold when the build started — the previous agent, or
      # nothing at all. Here the agent is built first and on its own, so what ends up inside
      # the bundle is the agent this command just produced.
      #
      # `agent:build` needs the agent's own repository and says where to point it when it is
      # not at {{.AGENT_REPO}}. That is a failure here rather than a shrug, because this task
      # was asked for an agent; `task build` on its own remains the one that carries none and
      # says so.
      - task: agent:build
      - task: build
      # The node too. This computer's two programs are the desktop and the CLI, and a task
      # called `all` that quietly built one of them would be naming itself wrongly. Nothing of
      # the agent is in this one: a node in a rack has none.
      - task: build:cli

  # ----- Housekeeping --------------------------------------------------------

  clean:
    desc: Remove build artifacts
    cmds:
      - task: banner
        vars: { OPERATION: clean }
      - rm -rf dist
      # One target directory for the whole workspace, at the root, so this is run from here
      # rather than pointed at a member's manifest.
      - cargo clean
      - task: agent:clean
