version: "3"

vars:
  # A command line for whichever program is being run, e.g. task dev ARGS="--hidden" or
  # task dev:cli ARGS="--quiet". The windowed application answers one flag and reads it in
  # src-tauri/src/launch.rs; the node's surface is in cli/src/arguments.rs.
  ARGS: ""
  # Where the agent's own repository is, for `task agent:build`. It is a repository of its own
  # — released on its own schedule, not a subdirectory of this one — so a checkout of this
  # repository alone will not have it, and that is an accepted state rather than a failure.
  AGENT_REPO: "../agent"
  # The built agent to bundle. What `task build` in that repository leaves behind.
  AGENT_DIST: "../agent/dist/almena-agent"

tasks:
  # Announce the project and the operation about to run. Every task calls it as
  # its first command, passing OPERATION.
  banner:
    internal: true
    silent: true
    cmds:
      - |
        cat <<'ART'
            _     _      __  __  _____  _   _     _
           / \   | |    |  \/  || ____|| \ | |   / \
          / _ \  | |    | |\/| ||  _|  |  \| |  / _ \
         / ___ \ | |___ | |  | || |___ | |\  | / ___ \
        /_/   \_\|_____||_|  |_||_____||_| \_|/_/   \_\
        ART
      - |
        # The operation is drawn character by character, so a new task needs no
        # artwork of its own. Only shell builtins are used, so that the banner
        # also runs on Windows, where Task interprets these commands itself.
        draw() {
          rest="$1"; top=''; mid=''; bot=''
          while [ -n "$rest" ]; do
            c="${rest%"${rest#?}"}"; rest="${rest#?}"
            case "$c" in
              a|A) t='____'; m='|__|'; b='|  |' ;;
              b|B) t='___ '; m='|__]'; b='|__]' ;;
              c|C) t='____'; m='|   '; b='|___' ;;
              d|D) t='___ '; m='|  \'; b='|__/' ;;
              e|E) t='____'; m='|___'; b='|___' ;;
              f|F) t='____'; m='|___'; b='|   ' ;;
              g|G) t='____'; m='| __'; b='|__]' ;;
              h|H) t='_  _'; m='|__|'; b='|  |' ;;
              i|I) t='_'; m='|'; b='|' ;;
              j|J) t='   _'; m='   |'; b='|__|' ;;
              k|K) t='_  _'; m='|_/ '; b='| \_' ;;
              l|L) t='_   '; m='|   '; b='|___' ;;
              m|M) t='_  _'; m='|\/|'; b='|  |' ;;
              n|N) t='_  _'; m='|\ |'; b='| \|' ;;
              o|O) t='____'; m='|  |'; b='|__|' ;;
              p|P) t='___ '; m='|__]'; b='|   ' ;;
              q|Q) t='____'; m='|  |'; b='|_\|' ;;
              r|R) t='____'; m='|__/'; b='|  \' ;;
              s|S) t='____'; m='[__ '; b='___]' ;;
              t|T) t='___'; m=' | '; b=' | ' ;;
              u|U) t='_  _'; m='|  |'; b='|__|' ;;
              v|V) t='_  _'; m='|  |'; b=' \/ ' ;;
              w|W) t='_  _'; m='|  |'; b='|/\|' ;;
              x|X) t='_  _'; m=' \/ '; b='_/\_' ;;
              y|Y) t='_   _'; m=' \_/ '; b='  |  ' ;;
              z|Z) t='___'; m='  /'; b='/__' ;;
              :)   t='  '; m='. '; b='. ' ;;
              *)   t='  '; m='  '; b='  ' ;;
            esac
            top="$top$t "; mid="$mid$m "; bot="$bot$b "
          done
          printf '%s\n%s\n%s\n' "$top" "$mid" "$bot"
        }
        echo ""
        draw '{{.OPERATION}}'
        echo ""

  default:
    desc: List available tasks
    cmds:
      - task: banner
        vars: { OPERATION: list }
      - task --list
    silent: true

  install:
    desc: Install frontend dependencies
    cmds:
      - task: banner
        vars: { OPERATION: install }
      - pnpm install
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml

  # ----- Checks --------------------------------------------------------------

  # `check`, `format` and `test` are narrower than they will end up, and deliberately so.
  # ESLint, Prettier and Vitest are not installed in this repository yet, so the frontend
  # halves of these three — `pnpm lint`, `pnpm format:check`, `pnpm test` — are absent rather
  # than present and passing vacuously. Each joins the task below it in the step that brings
  # its tool.

  catalogs:
    desc: Check that every translation catalog holds the same keys
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: catalogs }
      - node scripts/check-catalogs.mjs

  check:
    desc: Run every check a change has to pass before it is pushed
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: check }
      # Formatting first: it is the cheapest failure and the least interesting to argue
      # about. A warning is a failure, so that the count never grows past reading.
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - pnpm exec tsc --noEmit
      - task: catalogs
      - task: isolation

  agent:build:
    desc: Build the agent from its own repository, so that there is something to stage
    preconditions:
      - sh: test -d {{.AGENT_REPO}}
        msg: |
          No agent at {{.AGENT_REPO}}. It is a repository of its own:
          git clone https://github.com/almena-network/agent
          Or point this at one: task agent:build AGENT_REPO=/path/to/agent
    cmds:
      - task: banner
        vars: { OPERATION: agent }
      - task -d {{.AGENT_REPO}} build

  agent:stage:
    desc: Put the built agent where the bundle will pick it up, if there is one to put
    cmds:
      # The directory always exists, with or without an agent in it. A contributor who cloned
      # this repository alone still gets a bundle that builds, and its AI screen reports
      # honestly that this build carries no agent — a state that has to exist and be drawn
      # whatever happens, so nothing is being worked around here.
      - task: agent:clean
      - |
        if [ -d "{{.AGENT_DIST}}" ]; then
          cp -R "{{.AGENT_DIST}}/." src-tauri/resources/almena-agent/
          echo "staged the agent from {{.AGENT_DIST}}"
        else
          echo "no agent at {{.AGENT_DIST}} — this build will carry none, and will say so"
        fi

  agent:clean:
    desc: Take the staged agent back out, keeping the directory the bundle expects
    cmds:
      # Everything but the note, which is committed: the bundle names this directory, so it
      # has to exist in a fresh checkout with no agent built anywhere.
      - |
        mkdir -p src-tauri/resources/almena-agent
        find src-tauri/resources/almena-agent -mindepth 1 ! -name .keep -maxdepth 1 \
          -exec rm -rf {} +

  isolation:
    desc: Check that the two programs stay out of each other's dependency graph
    cmds:
      - task: banner
        vars: { OPERATION: isolation }
      # `cargo tree -i` asks which crates depend on a package *within this crate's graph*, and
      # fails when the package is not in that graph at all — so here success is the failure,
      # and silence is the pass.
      #
      # Each binary links what its own graph holds and nothing else, which is only true while
      # the graphs are kept apart. A windowed application that linked `ratatui`, or a node that
      # linked `tauri`, would carry a renderer it never calls: minutes of build time and tens of
      # megabytes, for nothing. The two crates that are neither program must reach neither
      # framework, which is what makes them decisions rather than parts of one of them.
      - |
        failed=0
        assert_cannot_reach() {
          if cargo tree -q -p "$1" -i "$2" >/dev/null 2>&1; then
            echo "$1 can reach $2: $3" >&2
            failed=1
          fi
        }

        assert_cannot_reach almena-log tauri \
          "the log format must know about no framework"
        assert_cannot_reach almena-paths tauri \
          "the resolver exists for the programs Tauri does not serve"
        assert_cannot_reach almena-cli tauri \
          "the node must not link a webview it never draws in"
        assert_cannot_reach almena-app ratatui \
          "the windowed application must not link a terminal renderer"
        assert_cannot_reach almena-agent-protocol tauri \
          "a wire contract must reach no framework, or no other runtime could speak it"
        assert_cannot_reach almena-cli almena-agent-protocol \
          "a node in a rack has no agent beside it to speak to"

        exit "$failed"

  test:agent:
    desc: Drive the staged agent over real pipes, to check the two halves of the contract meet
    cmds:
      - task: banner
        vars: { OPERATION: agent }
      # Ignored by `task test`, and run on purpose here: it needs an artifact from another
      # repository, and a test that passed quietly when it could not find one would be green
      # on every machine that had nothing to test with.
      - cargo test -p almena-app --test speaks_to_the_agent -- --ignored --test-threads=1

  test:
    desc: Run the test suites
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: test }
      - cargo test --workspace

  format:
    desc: Format the source
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: format }
      - cargo fmt --all

  # ----- Branding ------------------------------------------------------------

  icons:
    desc: Regenerate every icon from assets/branding
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: icons }
      # The manifest drives the whole set: the desktop sizes and the Windows Store logos. It
      # also carried the Android adaptive layers — background, foreground and monochrome, which
      # cannot be derived from a single square — and nothing built here runs on a phone now.
      - pnpm tauri icon assets/branding/icon-manifest.json
      # macOS wants its own padding inside the rounded square, which the manifest has no way
      # to express, so the `.icns` is generated a second time from the artwork that has it.
      # Without this the icon in the Dock is visibly larger than every other one there.
      - cmd: pnpm tauri icon assets/branding/app-icon-macos.png -o /tmp/almena-icons
        platforms: [darwin]
      - cmd: cp /tmp/almena-icons/icon.icns src-tauri/icons/icon.icns
        platforms: [darwin]
      - cmd: rm -rf /tmp/almena-icons
        platforms: [darwin]
      # The two tray glyphs, at the size a menu bar draws them. `tray.png` is the bare mark:
      # macOS is handed it as a template image, tints it itself, and would draw a square of
      # its own as a square. `trayNegative.png` is the reversed one, for the platforms that do
      # not tint and may put it on a dark bar.
      - cmd: sips -z 32 32 assets/branding/tray/tray-icon.png --out src-tauri/icons/tray.png
        platforms: [darwin]
      - cmd: sips -z 32 32 assets/branding/tray/tray-icon-negative.png --out src-tauri/icons/trayNegative.png
        platforms: [darwin]

  # ----- Development ---------------------------------------------------------

  dev:
    aliases: [dev:desktop]
    desc: 'Run on this computer, with hot reload. ARGS="--hidden" gives it a command line'
    deps: [install, agent:stage]
    cmds:
      - task: banner
        vars: { OPERATION: dev }
      # Two `--` and both are load-bearing: the first ends what is meant for the Tauri CLI, the
      # second ends what is meant for cargo, and what is left over is the application's own
      # command line. Without them `task dev ARGS="--hidden"` hands `--hidden` to cargo, which
      # does not know it. This is the only way to try `--hidden`, `--help` or `--version`
      # without building a binary first.
      - pnpm tauri dev {{if .ARGS}}-- -- {{.ARGS}}{{end}}

  dev:cli:
    desc: Run the node in this terminal
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: "dev:cli" }
      # No hot reload and nothing to serve: this program has no frontend. `ARGS` reaches it the
      # ordinary way, because there is no Tauri CLI in between to get past — `task dev:cli
      # ARGS="--quiet"` is the one to try when what you want to see is the records.
      - cargo run -q -p almena-cli -- {{.ARGS}}

  # ----- Release builds ------------------------------------------------------

  build:
    aliases: [build:desktop]
    desc: Build the desktop installer for this host's operating system
    deps: [install, catalogs, agent:stage]
    cmds:
      - task: banner
        vars: { OPERATION: build }
      # Leaves the installers under target/release/bundle/ and the binary itself at
      # target/release/almena-app. Whatever `agent:stage` put in place is bundled with it;
      # where it put nothing, the application says so on its AI screen rather than pretending.
      - pnpm tauri build

  build:debug:
    desc: Build the desktop bundle unoptimized, so that it still says it is a development build
    deps: [install, catalogs, agent:stage]
    cmds:
      - task: banner
        vars: { OPERATION: "build:debug" }
      # `--debug` keeps `debug_assertions`, which is the one thing the status strip reads to
      # decide whether to say *Development* — so this is how a **bundle** that still admits what
      # it is gets made, and it takes a fraction of the time the release build does. Everything
      # lands under target/debug/ instead of target/release/.
      - pnpm tauri build --debug

  build:cli:
    desc: Build the node for this computer
    deps: [install]
    cmds:
      - task: banner
        vars: { OPERATION: "build:cli" }
      # One binary and no bundle. A node on a server is a file somebody copies there, and which
      # packages that becomes — the Debian and RPM families the desktop already builds for — is
      # not decided (`.agents/rules/deployments.md`).
      - cargo build -q --release -p almena-cli
      - cmd: echo "Built target/release/almena"
        silent: true

  build:all:
    desc: Build the agent, then both programs for this computer, with that agent inside the desktop
    cmds:
      - task: banner
        vars: { OPERATION: "build:all" }
      # Commands rather than `deps`, and that is the whole of this task: dependencies run at
      # the same time as each other, and `agent:stage` would then copy whatever
      # {{.AGENT_DIST}} happened to hold when the build started — the previous agent, or
      # nothing at all. Here the agent is built first and on its own, so what ends up inside
      # the bundle is the agent this command just produced.
      #
      # `agent:build` needs the agent's own repository and says where to point it when it is
      # not at {{.AGENT_REPO}}. That is a failure here rather than a shrug, because this task
      # was asked for an agent; `task build` on its own remains the one that carries none and
      # says so.
      - task: agent:build
      - task: build
      # The node too. This computer's two programs are the desktop and the CLI, and a task
      # called `all` that quietly built one of them would be naming itself wrongly. Nothing of
      # the agent is in this one: a node in a rack has none.
      - task: build:cli

  # ----- Housekeeping --------------------------------------------------------

  clean:
    desc: Remove build artifacts
    cmds:
      - task: banner
        vars: { OPERATION: clean }
      - rm -rf dist
      # One target directory for the whole workspace, at the root, so this is run from here
      # rather than pointed at a member's manifest.
      - cargo clean
      - task: agent:clean
