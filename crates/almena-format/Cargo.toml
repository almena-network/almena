[package]
name = "almena-format"
description = "The log entry, the operation, and the identifier an object gets from its own bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The check that says whether bytes are canonical. Kept in its own crate on purpose: the encoder
# here asserts against it rather than against itself, because a validator that only ever saw its
# own encoder's output would be a validator that agrees with a bug.
almena-cbor = { workspace = true }
almena-suite = { workspace = true }
almena-time = { workspace = true }
