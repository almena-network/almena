[package]
name = "almena-tls"
description = "The certificate a node serves under, and nothing else about serving"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The node's own key signs the certificate it serves under: one key, and no second census.
almena-suite = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
# A handshake in memory, so that the pair is proved against a real client and not by inspection.
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
