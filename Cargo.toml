# The workspace, and where every program in this repository is held to the same standard.
#
# One program is built here, on one framework. A workspace still earns its place: it is where
# the lint tables live, so that a crate added tomorrow is held to the same standard as the one
# added today without anybody remembering to copy a table.
#
# The lint tables are here, and deliberately: a member that set its own would be a member held
# to a different standard, and the point of denying a warning is that the count never grows to
# where nobody reads it.

[workspace]
resolver = "3"
members = [
  "cli",
  "crates/almena-agent-protocol",
  "crates/almena-api",
  "crates/almena-cbor",
  "crates/almena-credential",
  "crates/almena-format",
  "crates/almena-frozen",
  "crates/almena-log",
  "crates/almena-mailbox",
  "crates/almena-mesh",
  "crates/almena-lookup",
  "crates/almena-node",
  "crates/almena-paths",
  "crates/almena-sdk",
  "crates/almena-serve",
  "crates/almena-status",
  "crates/almena-store",
  "crates/almena-suite",
  "crates/almena-time",
  "crates/almena-tls",
  "partner",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Almena Network Authors"]
repository = "https://github.com/almena-network/almena"

[workspace.lints.rust]
# Every public item carries a doc comment. This is what makes the rule enforceable rather
# than a thing a reviewer has to remember.
missing_docs = "deny"
# Lifted per module, with a `// SAFETY:` comment on every block, never crate-wide.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Pedantic, and therefore off until asked for. The threshold is in `clippy.toml`.
too_many_lines = "deny"
# A panic in an interface is an interface that vanishes mid-sentence. Allowed in tests, which
# `clippy.toml` states.
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"

# Every third-party version this repository pins, written once. A member names a dependency
# and not a number, so two members can never end up on two versions of the same crate and
# nobody has to grep to find out which version is in use.
[workspace.dependencies]
# The mesh. Chosen for what it gives that HTTP does not: getting through a domestic router, one
# identity rather than two censuses to keep in step, and content asked for by hash. Kept to the
# smallest set of features that does those things.
libp2p = { version = "0.56", default-features = false, features = [
  "ed25519",
  "noise",
  "yamux",
  "tcp",
  "dns",
  "tokio",
  "macros",
  "identify",
  "request-response",
  # **What puts a number on how far away a peer is.** A round trip is the only thing about a
  # connection that a person reading a list of peers can act on — it is the difference between a
  # node beside them and one on another continent — and nothing else on the wire measures it.
  "ping",
  # **What lets a node behind a household router be part of the network at all.** Without it only a
  # machine with an address anybody can dial may join, which would make *open and without
  # permission* true only for people who have one. Carrying somebody else's traffic is a capability
  # and not a duty: a node says whether it does it, and is measured on it like anything else.
  "relay",
] }
almena-mesh = { path = "crates/almena-mesh" }
# Already in the tree by way of libp2p; named here because the codec trait it defines is one this
# project implements, and an implementation cannot use a macro it does not depend on.
async-trait = { version = "0.1" }
hickory-resolver = { version = "0.26" }
almena-lookup = { path = "crates/almena-lookup" }
# TLS for whichever face serves under a certificate. Not in the transport: serving takes a stream
# and does not ask what it is, so the second cryptographic implementation enters with the face that
# needs it rather than with everything that links the transport. `ring` rather than the default
# provider, and named here so that nothing picks one by accident.
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
almena-tls = { path = "crates/almena-tls" }
# This repository's own crates. Paths, because they are published with it or not at all.
almena-agent-protocol = { path = "crates/almena-agent-protocol" }
# The canonical CBOR profile and its check. No dependencies: every identifier hangs from these
# bytes, so the rule that decides them is one anybody can read end to end.
# What can be asked of a node and what comes back. It knows nothing about a network: reaching
# `hyper` from here is what `task isolation` refuses, so an answer can never learn what a status
# code or a stream is.
almena-api = { path = "crates/almena-api" }
almena-cbor = { path = "crates/almena-cbor" }
# The credential itself: SD-JWT VC, its disclosures, and what verifying one may conclude. It fetches
# nothing and trusts nobody — it is given a presentation and a set of facts, and answers.
almena-credential = { path = "crates/almena-credential" }
# The log entry, the operation, and the identifier an object takes from the operation that
# creates it. Replicated in `client`, held to the same golden vectors.
almena-format = { path = "crates/almena-format" }
almena-frozen = { path = "crates/almena-frozen" }
almena-mailbox = { path = "crates/almena-mailbox" }
almena-log = { path = "crates/almena-log" }
# Everything a node does. Both faces of the node call this and neither holds logic of its own.
almena-node = { path = "crates/almena-node" }
almena-paths = { path = "crates/almena-paths" }
# The crypto suite, fixed once for the whole platform because a second definition would agree with
# the first for about a month. Replicated in `client`, held to the same golden vectors.
# What a node keeps: the append-only log and the chain each object advances along.
# The transport, which decides nothing: it carries a question to `almena-api` and writes down
# whatever comes back.
# What an issuer and a verifier are built on. **In this repository on purpose** (`SPECS.md §13`):
# the house that validates these rules on one side of the wire writes the library that speaks them
# on the other, so a disagreement between the two is a bug inside one repository rather than an
# argument between two.
almena-sdk = { path = "crates/almena-sdk" }
almena-serve = { path = "crates/almena-serve" }
almena-status = { path = "crates/almena-status" }
almena-store = { path = "crates/almena-store" }
almena-suite = { path = "crates/almena-suite" }
# The epoch, and every deadline the protocol counts in them. Replicated in `client` rather than
# shared, so neither repository owns the other's format, and held to the same golden vectors,
# which is what keeps two honest copies from drifting a byte apart.
almena-time = { path = "crates/almena-time" }

# The application. `tray-icon` is what lets it live on a bar with no window on screen, and
# `image-png` is what lets the glyph it wears be one of the files `task icons` generates rather
# than the application icon at a size nothing designed it for.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
# What a person reads back when something went wrong.
tauri-plugin-log = "2"
# What the application says when its own window is not what the person is looking at. Adopted
# because it serves every platform this repository builds for — a dependency that served only
# some leaves one platform quietly missing what the others do.
tauri-plugin-notification = "2"
# What the window remembers between runs, and what folds a second launch into the running
# application instead of starting another.
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# The native dialogs — a question, a warning, a file to pick. Nothing draws one yet.
tauri-plugin-dialog = "2"
# Updating the application in place, where an application is a file somebody downloaded.
# Registered but never asked: it may say a version exists, never install one unasked — an
# identity application left out of date is a risk, and an update nobody chose is a decision
# taken for the person running it. The endpoint and the key it would need are not decided.
tauri-plugin-updater = "2"
# Whether the operating system opens this application when somebody logs in. Windows and
# Linux only: each has one register for it and this writes to it. macOS keeps two and means
# different things by them, so it is served by the crate below instead.
tauri-plugin-autostart = "2"
# macOS alone. `SMAppService` is the one API that registers an application under *Open at
# Login* — its own name, its own icon — without asking a person for permission to drive System
# Events, and without writing the `LaunchAgent` that would land it under *Allow in the
# Background* instead. Part of the `objc2` family, which is the maintained way into Objective-C
# from Rust.
objc2-service-management = { version = "0.3", default-features = false, features = [
  "std",
  "SMAppService",
  "objc2",
  "objc2-foundation",
] }

# The CLI: the node for a computer with no graphical system. `clap` reads its four arguments,
# and `ratatui` over `crossterm` draws it for whoever is watching. None of the three is in the
# windowed application's graph and `task isolation` is what says so.
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
# What turns Ctrl-C, and the SIGTERM a service manager sends, into a stop this program can
# write a record about. `termination` is what adds the second one.
ctrlc = { version = "3.5.2", features = ["termination"] }

# The one crate that knows where a platform keeps things, and the reason `almena-paths` can
# promise to agree with Tauri's resolver: this is the crate that resolver calls, at the major
# version it calls it at. Bumping past Tauri's is what would break that promise.
dirs = "6"

# The Agent Protocol's encoding. Binary, so that a frame is a frame rather than a line
# somebody could have written by hand — and small, which matters on a pipe carrying tokens.
rmp-serde = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The facade every program writes records through. What they look like is `almena-log`.
log = "0.4"
time = "0.3.55"

# The algorithms themselves, all of them RustCrypto: one family, pure Rust, and therefore one
# cross-compilation story for the five desktop platforms plus Android and iOS.
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# `ecdh` is for the partner's DIDComm envelope, which agrees a key with a holder's device the way
# the holder's app does; it turns on nothing that is not already in the graph.
p256 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "ecdh"] }
# The words a person writes down. Derivation from them is SLIP-0010, which is short enough to
# hold here rather than take a dependency for — see `seed.rs`.
bip39 = { version = "2", default-features = false, features = ["std"] }
hmac = "0.12"
# Where a key that has to be unguessable comes from. The suite deliberately generates nothing —
# every path in it is reproducible in a test, and nothing in it can be weakened by a bad
# generator — so the need lands here instead. This is the operating system's own source and
# carries no algorithm of its own: one crate, and nothing to get wrong.
getrandom = "0.3"
# The block cipher the partner's DIDComm envelope is built over: AES key wrap (RFC 3394) and
# CBC are written out by hand on top of it, exactly as the holder's app composes them, so that
# what the reference issuer seals is what a wallet opens. Already in the graph by way of the
# mesh's handshake; named here so that nothing picks a second block cipher by accident.
aes = "0.8"
# The one compression this project does, and it is not a choice: the W3C Bitstring Status List
# fixes GZIP, and a list encoded any other way is one nothing else can read. Pure Rust
# (`miniz_oxide`) rather than the zlib backend, for the cross-compilation story `SPECS.md §4.11`
# picked the whole cryptographic suite for.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# What carries the node's interface. `hyper` is already in this workspace at exactly this version,
# built for the windowed application's updater — turning on its server side is a smaller supply
# chain event than adopting a framework this project does not have. There is no router: the set of
# questions is fixed and small, and a `match` covers it.
#
# **TLS is not here.** Whoever terminates it supplies the stream, so the second cryptographic
# implementation TLS needs enters with the face that needs it and not with every node.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
